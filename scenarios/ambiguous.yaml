name: ambiguous
kind: AMBIGUOUS
title: '"Make it handle heavy traffic and give us stats" - an ambiguous request'
baseline: url-shortener
requirement: |
  From: Marketing team
  "Our short links feel slow during campaigns and we have no idea what's happening with them.
  Can you make it handle heavy traffic and give us some stats?"
# DEMONSTRATION decisions, written with the scenario: used only with --approvals scripted (or
# when replaying, where they are the scenario default) and recorded as "scripted-demo", never as
# a human review. Each decision answers one request of its kind (acceptance unless stated) and
# only if it covers every reason code of that request; anything else pauses the run.
approvals: scripted
scriptedApprovals:
  clarify:
    # DEMONSTRATION ANSWERS written with the scenario to exercise the clarification flow; no
    # stakeholder was consulted. In an interactive run the stakeholder edits these instead.
    - approve: true
      covers: [sign-off]
      comment: Demonstration answers (not from a real stakeholder).
      amendments:
        clarification.answers: |
          Q-1: Campaign peaks of about 2,000 redirects/second; link creation stays low.
          Q-2: Redirect p99 latency under 50 ms at that load.
          Q-3: Per-link total clicks, last click time, daily counts for the last 7 days by
               default and up to 90; a JSON API is enough, no dashboard.
          Q-4: Best effort is fine; statistics may lag by up to one minute.
          Q-5: No personal data: referrer host and browser/bot/other only; keep 90 days.
  design:
    - approve: true
      covers: [sign-off, api-contract-change]
      comment: >-
        Demonstration decision: meets the clarified answers without new infrastructure; the
        2,000 rps / p99 < 50 ms target is measured by the load test, not assumed.
  impl-click-storage:
    - approve: true
      covers: [schema-migration]
      comment: Demonstration decision - additive V2 table and indexes.
  tests:
    - approve: true
      covers: [change-size]
      comment: Demonstration decision - test-only change set above the 800-line threshold.
  release:
    - approve: true
      covers: [sign-off]
      comment: Demonstration decision - release accepted on the validated tree.
