spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

shortener:
  base-url: http://localhost:8080
  code-length: 7
  redirect-cache:
    ttl: 10m
    max-size: 10000
  rate-limit:
    requests-per-period: 20
    period: 1m
    max-tracked-clients: 100000
  trust-forwarded-headers: false

# Swagger UI at /swagger-ui.html, showing the hand-written contract instead of a spec generated
# from the code, so the UI and the API compatibility gate see the same document. The generated
# /v3/api-docs endpoint is switched off; springdoc.api-docs.enabled must stay on for the UI.
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /openapi.yaml
    try-it-out-enabled: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: url-shortener
    description: URL shortener service (v1 baseline)
