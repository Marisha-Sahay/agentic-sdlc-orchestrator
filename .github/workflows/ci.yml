name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit + Testcontainers integration tests (Docker is available on GitHub runners),
      # Checkstyle and the 80% JaCoCo gate for every module.
      - name: Build and verify
        run: mvn -B -ntp verify
      # End to end: every scenario with recorded (or hand-authored) model replies, including
      # the governance drill. Real agents, policy, gates and Maven builds; no API key.
      - name: Replay scenarios (no API key needed)
        run: |
          for dir in cassettes/*/; do
            scenario="$(basename "$dir")"
            ./agentic run "$scenario" --llm replay --approvals scripted --run-id "ci-$scenario"
            ./agentic verify-log "ci-$scenario"
          done
          ./agentic metrics
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-reports
          path: .runs/*/report.html
          if-no-files-found: ignore
