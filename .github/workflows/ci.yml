name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit + Testcontainers integration tests (Docker is available on GitHub runners),
      # Checkstyle and the 80% JaCoCo gate for every module.
      - name: Build and verify
        run: mvn -B -ntp verify
      - name: Replay recorded scenarios (no API key needed)
        if: hashFiles('cassettes/**/*.json') != ''
        run: |
          for scenario in greenfield brownfield ambiguous; do
            if [ -d "cassettes/$scenario" ]; then
              ./agentic run "$scenario" --llm replay --approvals scripted \
                --run-id "ci-$scenario" || exit 1
            fi
          done
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-reports
          path: .runs/*/report.html
          if-no-files-found: ignore
